<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>차량 사진 연속 촬영</title>
<style>
  :root{ --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#e2e8f0; --muted:#94a3b8;
         --brand:#2563eb; --ok:#16a34a; --err:#dc2626; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:'Malgun Gothic','맑은 고딕',-apple-system,'Apple SD Gothic Neo',sans-serif;
    -webkit-user-select:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100dvh}

  header{padding:10px 14px;background:#0b1220;border-bottom:1px solid var(--line);flex:none}
  header b{font-size:16px}
  header .sub{font-size:12px;color:var(--muted);margin-top:2px}

  #stage{position:relative;flex:1 1 auto;min-height:0;background:#000;overflow:hidden}
  video{width:100%;height:100%;object-fit:cover;display:block}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
       text-align:center;padding:24px;font-size:14px;line-height:1.7;color:var(--muted)}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .18s}

  #strip{flex:none;display:flex;gap:6px;padding:8px;overflow-x:auto;background:#0b1220;
         border-top:1px solid var(--line);min-height:76px;align-items:center}
  #strip:empty::after{content:'아직 찍은 사진이 없습니다';color:var(--muted);font-size:12px;padding:0 6px}
  .th{position:relative;flex:none;width:60px;height:60px;border-radius:8px;overflow:hidden;
      border:1px solid var(--line)}
  .th img{width:100%;height:100%;object-fit:cover;display:block}
  .th button{position:absolute;top:1px;right:1px;width:20px;height:20px;border:0;border-radius:50%;
             background:rgba(0,0,0,.65);color:#fff;font-size:13px;line-height:20px;padding:0;cursor:pointer}
  .th span{position:absolute;left:2px;bottom:1px;font-size:10px;color:#fff;
           text-shadow:0 1px 2px #000;font-weight:700}

  footer{flex:none;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
         background:#0b1220;border-top:1px solid var(--line);
         display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--txt);
       border-radius:10px;padding:12px 10px;font-size:14px;font-weight:700;cursor:pointer;width:100%}
  .btn:disabled{opacity:.45}
  .btn.p{background:var(--brand);border-color:var(--brand)}
  #shutter{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#fff3;cursor:pointer}
  #shutter:active{background:#fff8}
  #shutter:disabled{opacity:.35}

  #toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);max-width:88%;
         background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:10px 14px;
         font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;text-align:center}
  #toast.on{opacity:1}
  #toast.err{border-color:var(--err);color:#fecaca}
  #toast.ok{border-color:var(--ok);color:#bbf7d0}
</style>
</head>
<body>
<div id="app">
  <header>
    <b id="title">차량 사진 촬영</b>
    <div class="sub" id="sub">앱에서 열어야 합니다</div>
  </header>

  <div id="stage">
    <video id="cam" playsinline muted autoplay></video>
    <div id="msg">카메라를 준비하는 중…</div>
    <div id="flash"></div>
  </div>

  <div id="strip"></div>

  <footer>
    <button class="btn" id="btnSwap">앞/뒤 전환</button>
    <button id="shutter" title="촬영"></button>
    <button class="btn p" id="btnSend" disabled>전송</button>
  </footer>
</div>
<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════
   차량 사진 연속 촬영 페이지
   - Apps Script 화면 안에서는 브라우저가 카메라를 막아서(샌드박스 iframe),
     촬영만 이 페이지에서 하고 사진은 Apps Script 로 보냅니다.
   - 접속 정보는 주소의 # 뒤에 담겨 옵니다. # 뒤는 서버로 전송되지 않고
     이 페이지 소스에도 남지 않습니다.
       #u=<전송주소>&k=<업로드키>&v=<차량ID>&n=<차량번호>&c=<구분>&r=<돌아갈주소>
   ══════════════════════════════════════════════════════════ */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var shots = [];          // {blob, url, name}
  var stream = null;
  var facing = 'environment';
  var MAX_EDGE = 1600;     // 긴 변 기준 축소 — 앱의 업로드 규격과 동일
  var QUALITY = 0.85;

  /* ── 주소에서 설정 읽기 ─────────────────────────── */
  function readHash() {
    var h = (location.hash || '').replace(/^#/, '');
    var o = {};
    h.split('&').forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf('=');
      var k = i < 0 ? kv : kv.substring(0, i);
      var v = i < 0 ? '' : kv.substring(i + 1);
      try { o[k] = decodeURIComponent(v); } catch (e) { o[k] = v; }
    });
    return o;
  }
  var CFG = readHash();

  function toast(text, kind) {
    var t = $('toast');
    t.textContent = text;
    t.className = 'on ' + (kind || '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = ''; }, kind === 'err' ? 5000 : 2600);
  }

  function fatal(html) {
    $('msg').innerHTML = html;
    $('msg').style.display = 'flex';
    $('shutter').disabled = true;
    $('btnSwap').disabled = true;
  }

  /* ── 설정 확인 ─────────────────────────────────── */
  if (!CFG.u || !CFG.k || !CFG.v) {
    fatal('이 페이지는 <b>차량관리 앱에서 열어야</b> 합니다.<br><br>'
        + '앱 → 차량 상세 → <b>📷 연속 촬영</b> 을 눌러주세요.');
    $('sub').textContent = '필요한 정보가 없습니다';
  } else {
    $('title').textContent = (CFG.n ? CFG.n : '차량') + ' — ' + (CFG.c || '입고사진');
    $('sub').textContent = '찍은 뒤 [전송]을 누르면 드라이브에 저장됩니다';
    startCam();
  }

  /* ── 카메라 ────────────────────────────────────── */
  function startCam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      fatal('이 브라우저는 카메라를 지원하지 않습니다.<br>크롬 또는 사파리로 열어주세요.');
      return;
    }
    stop();
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(function (s) {
      stream = s;
      var v = $('cam');
      v.srcObject = s;
      v.play();
      $('msg').style.display = 'none';
      $('shutter').disabled = false;
    }).catch(function (err) {
      var name = (err && err.name) || '';
      var why = name === 'NotAllowedError'
          ? '카메라 권한이 거부되었습니다.<br>주소창 왼쪽 자물쇠 → 권한 → 카메라 허용으로 바꾼 뒤 새로고침하세요.'
        : name === 'NotFoundError' ? '카메라를 찾지 못했습니다.'
        : '카메라를 열지 못했습니다. (' + name + ')';
      fatal(why);
    });
  }
  function stop() {
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  }

  $('btnSwap').addEventListener('click', function () {
    facing = (facing === 'environment') ? 'user' : 'environment';
    startCam();
  });

  /* ── 촬영 ──────────────────────────────────────── */
  function shoot() {
    var v = $('cam');
    if (!v.videoWidth) { toast('카메라가 아직 준비되지 않았습니다.', 'err'); return; }
    var w = v.videoWidth, h = v.videoHeight;
    var s = Math.min(1, MAX_EDGE / Math.max(w, h));
    var cw = Math.round(w * s), ch = Math.round(h * s);
    var cv = document.createElement('canvas');
    cv.width = cw; cv.height = ch;
    cv.getContext('2d').drawImage(v, 0, 0, cw, ch);

    var f = $('flash');
    f.style.opacity = '.8';
    setTimeout(function () { f.style.opacity = '0'; }, 120);

    cv.toBlob(function (blob) {
      if (!blob) { toast('사진을 만들지 못했습니다.', 'err'); return; }
      var n = shots.length + 1;
      shots.push({ blob: blob, url: URL.createObjectURL(blob), name: 'shot_' + n + '.jpg' });
      render();
    }, 'image/jpeg', QUALITY);
  }
  $('shutter').addEventListener('click', shoot);

  // 볼륨 버튼 대용 — 화면 아무 곳이나 두 번 두드리면 촬영
  var lastTap = 0;
  $('stage').addEventListener('click', function () {
    var now = Date.now();
    if (now - lastTap < 400) shoot();
    lastTap = now;
  });

  /* ── 썸네일 ────────────────────────────────────── */
  function render() {
    var box = $('strip');
    box.innerHTML = '';
    shots.forEach(function (s, i) {
      var d = document.createElement('div');
      d.className = 'th';
      d.innerHTML = '<img src="' + s.url + '" alt=""><span>' + (i + 1) + '</span>'
                  + '<button aria-label="빼기">×</button>';
      d.querySelector('button').addEventListener('click', function (ev) {
        ev.stopPropagation();
        URL.revokeObjectURL(s.url);
        shots.splice(i, 1);
        render();
      });
      box.appendChild(d);
    });
    box.scrollLeft = box.scrollWidth;
    $('btnSend').disabled = shots.length === 0;
    $('btnSend').textContent = shots.length ? (shots.length + '장 전송') : '전송';
  }

  /* ── 전송 ──────────────────────────────────────── */
  function toBase64(blob) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { res(String(fr.result).split(',')[1]); };
      fr.onerror = rej;
      fr.readAsDataURL(blob);
    });
  }

  /* Apps Script 로 보냅니다.
     Content-Type 을 지정하지 않아야(text/plain 으로 나감) 브라우저가
     사전확인(preflight)을 건너뛰어 CORS 에 걸리지 않습니다. */
  function post(payload) {
    return fetch(CFG.u, {
      method: 'POST',
      body: JSON.stringify(payload),
      redirect: 'follow'
    }).then(function (r) { return r.text(); }).then(function (t) {
      try { return JSON.parse(t); }
      catch (e) { throw new Error('서버 응답을 읽지 못했습니다: ' + t.substring(0, 120)); }
    });
  }

  var sending = false;
  $('btnSend').addEventListener('click', function () {
    if (sending || !shots.length) return;
    sending = true;
    var btn = this;
    var total = shots.length;
    btn.disabled = true;

    // 한 번에 다 보내면 요청이 너무 커지므로 3장씩 끊어 보냅니다.
    var CH = 3, done = 0, errs = [];
    var groups = [];
    for (var i = 0; i < shots.length; i += CH) groups.push(shots.slice(i, i + CH));

    var chain = Promise.resolve();
    groups.forEach(function (g) {
      chain = chain.then(function () {
        btn.textContent = '전송 중… ' + done + '/' + total;
        return Promise.all(g.map(function (s) {
          return toBase64(s.blob).then(function (b64) {
            return { name: s.name, mimeType: 'image/jpeg', dataBase64: b64 };
          });
        }));
      }).then(function (files) {
        return post({ key: CFG.k, vehicleId: CFG.v, category: CFG.c || '입고사진', files: files });
      }).then(function (res) {
        if (!res || res.error) throw new Error((res && res.error) || '알 수 없는 오류');
        done += (res.saved || 0);
        if (res.failed) errs.push(res.failed + '장 실패');
        btn.textContent = '전송 중… ' + done + '/' + total;
      }).catch(function (e) {
        errs.push(e && e.message ? e.message : String(e));
      });
    });

    chain.then(function () {
      sending = false;
      if (done === total && !errs.length) {
        shots.forEach(function (s) { URL.revokeObjectURL(s.url); });
        shots = []; render();
        toast('✓ ' + total + '장 전송 완료', 'ok');
        btn.textContent = '전송';
        sentTotal += total;
        // 복귀 주소로 자동 이동하지 않습니다.
        // 앱을 새로 띄우면 열어두었던 차량이 풀려서, 사진 목록도 팀즈 알림도 이어지지 않습니다.
        // 대신 "이 탭을 닫고 앱으로 돌아가세요" 안내만 띄웁니다.
        showDone();
        if (CFG.r) setTimeout(function () { stop(); location.href = CFG.r; }, 1200);
      } else {
        toast('전송 ' + done + '/' + total + ' — ' + errs.join(' / '), 'err');
        btn.disabled = false;
        btn.textContent = (shots.length - done > 0 ? (shots.length + '장 다시 전송') : '전송');
      }
    });
  });

  /* ── 전송을 마친 뒤 안내 ── */
  var sentTotal = 0;
  function showDone() {
    if (CFG.r) return;                       // 복귀 주소가 있으면 곧 이동하므로 그대로 둡니다
    var box = document.getElementById('msg');
    if (!box) return;
    box.innerHTML = '<div>'
      + '<div style="font-size:21px;color:#4ade80;font-weight:700">✓ ' + sentTotal + '장 전송 완료</div>'
      + '<div style="margin-top:12px;line-height:1.8">'
      + '<b>이 탭을 닫고 차량관리 앱으로 돌아가세요.</b><br>'
      + '돌아가면 사진 목록이 저절로 채워집니다.</div>'
      + '<div style="margin-top:12px;color:#94a3b8;font-size:13px">'
      + '더 찍으려면 잠시 기다리면 카메라로 돌아갑니다.</div>'
      + '</div>';
    box.style.display = 'flex';
    // 5초 뒤 카메라 화면으로 돌아갑니다 (계속 찍을 수 있게)
    setTimeout(function () { if (stream) box.style.display = 'none'; }, 5000);
  }

  /* ── 연결 확인 (?test 를 붙이면 카메라 없이 통신만 시험) ── */
  if (/(^|&)test(=|$)/.test((location.hash || '').replace(/^#/, '')) && CFG.u && CFG.k) {
    post({ key: CFG.k, ping: true })
      .then(function (r) { toast(r && r.pong ? '✓ 서버 연결 정상' : ('응답: ' + JSON.stringify(r)), r && r.pong ? 'ok' : 'err'); })
      .catch(function (e) { toast('연결 실패: ' + e.message, 'err'); });
  }

  window.addEventListener('pagehide', stop);
})();
</script>
</body>
</html>
